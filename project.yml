name: TuneTorrent
options:
  bundleIdPrefix: com.708cn
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.4"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    SKIP_INSTALL: "NO"

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19

targets:
  TuneTorrent:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    dependencies:
      - package: ZIPFoundation
    sources:
      - path: TuneTorrent
        excludes: ["**/*.md", "**/*.plist"]
      - path: TuneTorrent/Resources/Info.plist
        type: file
        buildPhase: none
    settings:
      base:
        INFOPLIST_FILE: TuneTorrent/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.708cn.tunetorrent
        PRODUCT_NAME: TuneTorrent
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: "NO"
    info:
      path: TuneTorrent/Resources/Info.plist
      properties:
        CFBundleName: TuneTorrent
        CFBundleIdentifier: com.708cn.tunetorrent

  TuneTorrentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources: [TuneTorrentTests]
    dependencies:
      - target: TuneTorrent

  TuneTorrentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.4"
    sources: [TuneTorrentUITests]
    dependencies:
      - target: TuneTorrent

schemes:
  TuneTorrent:
    build:
      targets:
        TuneTorrent: all
    test:
      targets: [TuneTorrentTests, TuneTorrentUITests]
      gatherCoverageData: true
    archive:
      config: Release
