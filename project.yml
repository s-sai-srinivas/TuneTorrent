name: TuneTorrent
options:
  bundleIdPrefix: com.708cn
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.4"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  TuneTorrent:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - TuneTorrent
    settings:
      base:
        INFOPLIST_FILE: TuneTorrent/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.708cn.tunetorrent
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: TuneTorrent/Resources/Info.plist
      properties: {}

  TuneTorrentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.4"
    sources: [TuneTorrentTests]
    dependencies:
      - target: TuneTorrent

  TuneTorrentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.4"
    sources: [TuneTorrentUITests]
    dependencies:
      - target: TuneTorrent

schemes:
  TuneTorrent:
    build:
      targets:
        TuneTorrent: all
    test:
      targets: [TuneTorrentTests, TuneTorrentUITests]
      gatherCoverageData: true
    archive:
      config: Release
