name: build-ipa
on: [push]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project (no Mac needed locally)
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Run Unit Tests
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentTests | xcpretty
      - name: Run XCUITests (33 tests - Tab/Music/Torrent/Files/Settings)
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentUITests | xcpretty
  build:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Archive (unsigned for sideload)
        run: |
          xcodebuild -project TuneTorrent.xcodeproj -scheme TuneTorrent -configuration Release -destination generic/platform=iOS archive -archivePath build/TuneTorrent.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcpretty
          echo "=== archive contents ==="
          ls -R build/TuneTorrent.xcarchive/ 2>&1 | head -n 80 || true
          find build -name "TuneTorrent.app" -type d 2>/dev/null | head -n 5 || true
          find ~/Library/Developer/Xcode/DerivedData -name "TuneTorrent.app" -type d 2>/dev/null | head -n 5 || true
      - name: Export IPA (sideload - manual Payload zip, no signing)
        run: |
          APP=$(find build -name "TuneTorrent.app" -type d | head -n1)
          if [ -z "$APP" ]; then APP=$(find ~/Library/Developer/Xcode/DerivedData -name "TuneTorrent.app" -type d | head -n1); fi
          echo "Found APP: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            rm -rf build/Payload
            mkdir -p build/Payload
            cp -R "$APP" build/Payload/
            echo "=== Payload ==="; ls -lh build/Payload/TuneTorrent.app/ | head -n 20
            echo "=== Binary size ==="; ls -lh build/Payload/TuneTorrent.app/TuneTorrent 2>&1 | head -n 5
            cd build && rm -f TuneTorrent.ipa && zip -r TuneTorrent.ipa Payload > /dev/null && ls -lh *.ipa && echo "IPA ready - real app"
          else
            echo "No .app found - build failed to produce app"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: TuneTorrent-ipa, path: build/*.ipa }
