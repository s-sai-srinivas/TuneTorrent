name: build-ipa
on: [push]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project (no Mac needed locally)
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Run Unit Tests
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentTests | xcpretty
      - name: Run XCUITests (33 tests - Tab/Music/Torrent/Files/Settings)
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentUITests | xcpretty
  build:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Archive (unsigned for sideload)
        run: |
          set -x
          xcodebuild -project TuneTorrent.xcodeproj -scheme TuneTorrent -configuration Release -destination generic/platform=iOS archive -archivePath $PWD/build/TuneTorrent.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcpretty
          echo "=== ARCHIVE PATH ==="; ls -lh build/TuneTorrent.xcarchive || true
          echo "=== FIND APP ==="; find $PWD/build -name "TuneTorrent.app" -type d -exec ls -lh {} \; 2>&1 | head -n 50 || true
          echo "=== DERIVED APP ==="; find ~/Library/Developer/Xcode/DerivedData -name "TuneTorrent.app" -type d -exec ls -lh {} \; 2>&1 | head -n 50 || true
          echo "=== XCARCHIVE CONTENTS ==="; ls -R build/TuneTorrent.xcarchive 2>&1 | head -n 100 || true
      - name: Export IPA (sideload - manual Payload zip, no signing)
        run: |
          set -x
          APP=$(find $PWD/build -name "TuneTorrent.app" -type d | head -n1)
          if [ -z "$APP" ]; then APP=$(find ~/Library/Developer/Xcode/DerivedData -name "TuneTorrent.app" -type d | head -n1); fi
          echo "Found APP: $APP"
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            echo "=== APP CONTENTS ==="; ls -lh "$APP" | head -n 30
            echo "=== BINARY ==="; ls -lh "$APP/TuneTorrent" || ls -lh "$APP" | head -n 20
            rm -rf build/Payload
            mkdir -p build/Payload
            cp -R "$APP" build/Payload/
            # Ensure Info.plist exists
            plutil -p build/Payload/TuneTorrent.app/Info.plist 2>&1 | head -n 20 || true
            echo "=== PAYLOAD ==="; ls -lh build/Payload/TuneTorrent.app/ | head -n 30
            du -sh build/Payload/TuneTorrent.app
            cd build && rm -f TuneTorrent.ipa && zip -r TuneTorrent.ipa Payload && ls -lh *.ipa && du -sh TuneTorrent.ipa && echo "IPA ready - real app"
          else
            echo "No .app found - failing"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: TuneTorrent-ipa, path: build/*.ipa }
