name: build-ipa
on: [push]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project (no Mac needed locally)
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Run Unit Tests
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentTests | xcpretty
      - name: Run XCUITests (33 tests - Tab/Music/Torrent/Files/Settings)
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentUITests | xcpretty
  build:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Archive (unsigned for sideload)
        run: |
          set -x
          xcodebuild -project TuneTorrent.xcodeproj -scheme TuneTorrent -configuration Release -destination generic/platform=iOS archive -archivePath $PWD/build/TuneTorrent.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcpretty
          echo "=== ARCHIVE APP EXPLICIT ==="
          ls -lh build/TuneTorrent.xcarchive/Products/Applications/TuneTorrent.app/ 2>&1 | head -n 30 || true
          echo "=== BINARY ==="; ls -lh build/TuneTorrent.xcarchive/Products/Applications/TuneTorrent.app/TuneTorrent 2>&1 | head -n 5 || true
          du -sh build/TuneTorrent.xcarchive/Products/Applications/TuneTorrent.app 2>&1 | head -n 5 || true
      - name: Export IPA (sideload - manual Payload zip, no signing)
        run: |
          set -x
          APP="build/TuneTorrent.xcarchive/Products/Applications/TuneTorrent.app"
          echo "Using explicit APP: $APP"
          ls -lh "$APP" 2>&1 | head -n 20 || echo "not found explicit"
          if [ ! -d "$APP" ]; then
            APP=$(find $PWD/build -name "TuneTorrent.app" -type d -path "*/Products/Applications/*" | head -n1)
            echo "Fallback find: $APP"
          fi
          if [ ! -d "$APP" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -name "TuneTorrent.app" -type d | head -n1)
            echo "Derived fallback: $APP"
          fi
          echo "Final APP: $APP"
          ls -lh "$APP/TuneTorrent" 2>&1 | head -n 5 || true
          if [ -n "$APP" ] && [ -d "$APP" ] && [ -f "$APP/TuneTorrent" ]; then
            rm -rf build/Payload
            mkdir -p build/Payload
            cp -R "$APP" build/Payload/
            ls -lh build/Payload/TuneTorrent.app/ | head -n 30
            du -sh build/Payload/TuneTorrent.app
            cd build && rm -f TuneTorrent.ipa && zip -r TuneTorrent.ipa Payload && ls -lh *.ipa && du -sh TuneTorrent.ipa && echo "IPA ready - real app $(du -sh TuneTorrent.ipa | cut -f1)"
          else
            echo "No valid .app with binary found"
            ls -R build 2>&1 | head -n 50 || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: TuneTorrent-ipa, path: build/*.ipa }
