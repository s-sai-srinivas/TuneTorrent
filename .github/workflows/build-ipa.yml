name: build-ipa
on: [push]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project (no Mac needed locally)
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Run Unit Tests
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentTests | xcpretty
      - name: Run XCUITests (33 tests)
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentUITests | xcpretty
  build:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Archive (unsigned for sideload)
        run: |
          set -x
          xcodebuild archive -project TuneTorrent.xcodeproj -scheme TuneTorrent -configuration Release -destination generic/platform=iOS -archivePath $PWD/build/TuneTorrent.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SKIP_INSTALL=NO | xcpretty
          echo "=== ARCHIVE CONTENTS ==="
          ls -R build/TuneTorrent.xcarchive 2>&1 | head -n 120 || true
          echo "=== LOOK FOR BINARY IN ARCHIVE ==="
          find build/TuneTorrent.xcarchive -name "TuneTorrent" -type f 2>&1 | head -n 20 || true
          find build/TuneTorrent.xcarchive -name "*.app" -type d 2>&1 | head -n 20 || true
          ls -lh build/TuneTorrent.xcarchive/Products/Applications/TuneTorrent.app/ 2>&1 | head -n 40 || true
          du -sh build/TuneTorrent.xcarchive 2>&1 | head -n 5 || true
      - name: Export IPA (sideload - manual Payload zip)
        run: |
          set -x
          APP="build/TuneTorrent.xcarchive/Products/Applications/TuneTorrent.app"
          echo "Checking explicit APP: $APP"
          ls -lh "$APP/TuneTorrent" 2>&1 | head -n 10 || echo "binary not at explicit path"
          if [ ! -f "$APP/TuneTorrent" ]; then
            APP=$(find build/TuneTorrent.xcarchive -name "TuneTorrent.app" -type d | head -n1)
            echo "Fallback find in xcarchive: $APP"
          fi
          if [ ! -f "$APP/TuneTorrent" ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*TuneTorrent.app" -type d -exec test -f "{}/TuneTorrent" \; -print | head -n1)
            echo "Derived search: $APP"
          fi
          echo "Final APP: $APP"
          ls -lh "$APP" 2>&1 | head -n 40 || true
          if [ -f "$APP/TuneTorrent" ]; then
            ls -lh "$APP/TuneTorrent"
            du -sh "$APP"
            rm -rf build/Payload
            mkdir -p build/Payload
            cp -R "$APP" build/Payload/
            cd build && rm -f TuneTorrent.ipa && zip -r TuneTorrent.ipa Payload && ls -lh *.ipa && du -sh TuneTorrent.ipa && echo "IPA ready $(du -sh TuneTorrent.ipa | cut -f1)"
            # also verify IPA contains binary
            unzip -l TuneTorrent.ipa | head -n 30 || true
          else
            echo "No valid .app with binary found - failing"
            find build -type f -name "TuneTorrent" 2>&1 | head -n 20 || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: TuneTorrent-ipa, path: build/*.ipa }
