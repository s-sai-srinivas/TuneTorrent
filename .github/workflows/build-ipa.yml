name: build-ipa
on: [push]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project (no Mac needed locally)
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Run Unit Tests
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentTests | xcpretty
      - name: Run XCUITests (33 tests - Tab/Music/Torrent/Files/Settings)
        run: xcodebuild test -project TuneTorrent.xcodeproj -scheme TuneTorrent -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' -only-testing:TuneTorrentUITests | xcpretty
  build:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Build iOS app (unsigned for sideload)
        run: |
          set -x
          xcodebuild -project TuneTorrent.xcodeproj -scheme TuneTorrent -configuration Release -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcpretty
          echo "=== BUILD PRODUCTS ==="
          find ~/Library/Developer/Xcode/DerivedData -name "TuneTorrent.app" -type d -exec ls -lh {} \; 2>&1 | head -n 60 || true
          echo "=== BINARY CHECK ==="
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Release-iphoneos/TuneTorrent.app" -type d | head -n1)
          echo "APP: $APP"
          ls -lh "$APP/TuneTorrent" 2>&1 | head -n 5 || true
          du -sh "$APP" 2>&1 | head -n 5 || true
      - name: Export IPA (sideload - manual Payload zip, no signing)
        run: |
          set -x
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path "*Release-iphoneos/TuneTorrent.app" -type d | head -n1)
          if [ -z "$APP" ]; then APP=$(find ~/Library/Developer/Xcode/DerivedData -name "TuneTorrent.app" -type d | head -n1); fi
          echo "Final APP: $APP"
          ls -lh "$APP" 2>&1 | head -n 30 || true
          ls -lh "$APP/TuneTorrent" 2>&1 | head -n 5 || true
          if [ -n "$APP" ] && [ -f "$APP/TuneTorrent" ]; then
            rm -rf build/Payload
            mkdir -p build/Payload
            cp -R "$APP" build/Payload/
            ls -lh build/Payload/TuneTorrent.app/ | head -n 30
            du -sh build/Payload/TuneTorrent.app
            mkdir -p build
            cd build && rm -f TuneTorrent.ipa && zip -r TuneTorrent.ipa Payload && ls -lh *.ipa && du -sh TuneTorrent.ipa && echo "IPA ready - real app $(du -sh TuneTorrent.ipa | cut -f1)"
          else
            echo "No valid .app with binary found"
            find ~/Library/Developer/Xcode/DerivedData -name "TuneTorrent.app" -type d 2>&1 | head -n 20 || true
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: TuneTorrent-ipa, path: build/*.ipa }
